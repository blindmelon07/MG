<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#1e2a78" />
        <title>You're offline - ACI Kiosk</title>
        <style>
            :root {
                color-scheme: light dark;
                --bg: #ffffff;
                --fg: #0a0a0a;
                --muted: #6b7280;
                --accent: #1e2a78;
            }

            @media (prefers-color-scheme: dark) {
                :root {
                    --bg: #0a0a0a;
                    --fg: #fafafa;
                    --muted: #a1a1aa;
                    --accent: #8b9cf5;
                }
            }

            body {
                margin: 0;
                min-height: 100vh;
                display: grid;
                place-items: center;
                padding: 24px;
                box-sizing: border-box;
                background: var(--bg);
                color: var(--fg);
                font-family: system-ui, sans-serif;
                text-align: center;
            }

            img {
                width: 88px;
                height: 88px;
            }

            h1 {
                font-size: 1.4rem;
                margin: 20px 0 8px;
            }

            p {
                color: var(--muted);
                margin: 0 0 24px;
                line-height: 1.5;
            }

            button {
                font: inherit;
                font-weight: 600;
                border: 0;
                border-radius: 999px;
                padding: 12px 24px;
                background: var(--accent);
                color: #fff;
            }
        </style>
    </head>
    <body>
        <main>
            <img src="/logo.png" alt="Aemilianum College Inc." />
            <h1>You're offline</h1>
            <p>
                Connect to Wi-Fi or mobile data to use the kiosk,<br />
                then try again.
            </p>
            <button type="button" onclick="location.reload()">Try again</button>
        </main>
    </body>
</html>
